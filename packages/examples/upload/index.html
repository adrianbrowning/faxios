<!doctype html>
<html>

<head>
  <title>faxios - file upload example</title>
  <link rel="stylesheet" type="text/css" href="//maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
</head>

<body class="container">
  <h1>file upload</h1>

  <form role="form" class="form" onsubmit="return false;">
    <div class="form-group">
      <label for="file">File</label>
      <input id="file" type="file" class="form-control" />
    </div>
    <button id="upload" type="button" class="btn btn-primary">Upload</button>
  </form>

  <div id="output" class="container"></div>

  <script type="importmap">
    { "imports": { "@gcmdev/faxios": "/faxios/index.js" } }
  </script>
  <script type="module">
    import faxios from "@gcmdev/faxios";

    const output = document.getElementById('output');
    document.getElementById('upload').onclick = function () {
      const data = new FormData();
      data.append('foo', 'bar');
      data.append('file', document.getElementById('file').files[0]);

      // fetch cannot report upload progress, so there is no onUploadProgress.
      output.className = 'container';
      output.textContent = 'Uploading...';

      faxios.put('/upload/server', data)
        .then(function () {
          output.className = 'container';
          output.textContent = 'Upload complete';
        })
        .catch(function (err) {
          output.className = 'container text-danger';
          output.textContent = err.message;
        });
    };
  </script>
</body>

</html>
