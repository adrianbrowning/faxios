<!doctype html>
<html>

<head>
  <title>faxios - post example</title>
  <link rel="stylesheet" type="text/css" href="//maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
</head>

<body class="container">
  <h1>faxios.post</h1>

  <form role="form" class="form" onsubmit="return false;">
    <div class="form-group">
      <label for="data">JSON</label>
      <textarea id="data" class="form-control" rows="5"></textarea>
    </div>
    <button id="post" type="button" class="btn btn-primary">POST</button>
  </form>

  <div id="output" class="container"></div>

  <script type="importmap">
    { "imports": { "@gcmdev/faxios": "/faxios/index.js" } }
  </script>
  <script type="module">
    import faxios from "@gcmdev/faxios";

    const output = document.getElementById('output');
    document.getElementById('post').onclick = function () {
      const data = document.getElementById('data').value;

      faxios.post('/post/server', JSON.parse(data))
        .then(function (res) {
          output.className = 'container';
          output.textContent = res.data;
        })
        .catch(function (err) {
          output.className = 'container text-danger';
          output.textContent = err.message;
        });
    };
  </script>
</body>

</html>
