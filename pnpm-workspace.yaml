packages:
  - 'packages/*'
  - '!packages/tests/smoke/**'
  - '!packages/tests/module/**'
strictDepBuilds: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@gingacodemonkey/config'
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true
overrides:
  minimatch: '>=10.2.1'
  vite: '>=6.4.3'
  # Patched releases for advisories flagged by `pnpm audit --audit-level=high`.
  brace-expansion@5: ^5.0.11
  browserslist@4: ^4.28.7
  fast-uri@3: ^3.1.7
  js-yaml@4: ^4.3.2
  nanoid@3: ^3.3.18
  postcss@8: ^8.5.18
  smol-toml@1: ^1.7.1
  undici@6: ^6.28.1
  undici@7: ^7.29.1
  yaml@2: ^2.8.3
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack exhaustion on deeply nested patterns. No patched release exists.
    # Only reachable through semantic-release-unsquash's commit analyzer (release tooling),
    # which matches repo-controlled patterns, not untrusted input.
    - GHSA-vfj7-8cjw-p6xm
