packages:
  - 'packages/*'
  - '!packages/tests/smoke/**'
  - '!packages/tests/module/**'
strictDepBuilds: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@gingacodemonkey/config'
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true
overrides:
  minimatch: '>=10.2.1'
  vite: '>=6.4.3'
  # Patched releases for advisories flagged by `pnpm audit --audit-level=high`.
  brace-expansion@5: ^5.0.11
  browserslist@4: ^4.28.7
  fast-uri@3: ^3.1.7
  js-yaml@4: ^4.3.2
  nanoid@3: ^3.3.18
  postcss@8: ^8.5.18
  smol-toml@1: ^1.7.1
  source-map-js@1: ^1.2.2
  undici@6: ^6.28.1
  undici@7: ^7.29.1
  vue@3: ^3.5.43
  vite@8: ^8.1.6
  yaml@2: ^2.8.3
  zod@4: ^4.6.6
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack exhaustion on deeply nested patterns. No patched release exists.
    # Checked 2026-10-14 with `pnpm why braces -r`: only path is zshy@0.8.0 -> fast-glob@3.3.3
    # -> micromatch@4.0.8 -> braces@3.0.3. zshy is a devDependency of packages/lib (the build
    # tool) and globs repo-controlled patterns at build time, never untrusted input, and braces
    # is not in the published package. Recheck when zshy or fast-glob updates.
    - GHSA-vfj7-8cjw-p6xm
    # zod <4.6.6 memory exhaustion on oversized constrained collections. The zod@4 override
    # patches zod 4; no patched zod 3 release exists. Checked 2026-11-20 with `pnpm why zod -r`:
    # the only zod 3 path is @gingacodemonkey/config -> eslint-plugin-react-compiler@19.1.0-rc.2
    # -> zod@3.25.76. It runs at lint time on repo-controlled config and is not in the published
    # package. Recheck when eslint-plugin-react-compiler moves to zod 4.
    - GHSA-mrhx-c7xc-m3w5
allowBuilds:
  'unrs-resolver': true
catalog:
  '@gingacodemonkey/config': ^0.1.0
  '@types/node': ^24.19.0
  esbuild: ^0.28.2
  eslint: ^9.39.5
  typescript: ^6.0.3
  typescript-eslint: ^8.71.0
  zod: 4.6.6
