# Link check for the repository's Markdown (.github/workflows/links.yml).
# links.yml remaps docs-site URLs, site routes (/pages/...) and github.com blob/main URLs to files in
# the checkout, so a link to a page or file the same PR adds passes and a link to a missing one fails.
no_progress = true
max_concurrency = 4
max_retries = 5
retry_wait_time = 10
# 429 and 503 are rate limits (github.com answers 503 to busy runners), not dead links.
accept = ["200..=299", "429", "503"]
include_mail = false
exclude = [
  '^https?://(localhost|127\.0\.0\.1)',
  '^https?://([a-z0-9-]+\.)?example\.(com|org|net)',
  # npm's website answers 403 to GitHub Actions runners.
  '^https?://(www\.)?npmjs\.(com|org)/',
]
exclude_path = [
  # Copied from the axios ecosystem; rewrite or delete it in #188.
  "ECOSYSTEM.md",
  # Release history inherited from axios, kept as written.
  "packages/lib/CHANGELOG.md",
  # axios's sponsor page, left out of the site (srcExclude in .vitepress/config.mts); #188.
  "packages/docs/pages/misc/sponsors.md",
  "node_modules",
]
