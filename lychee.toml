# Link check for the repository's Markdown (.github/workflows/links.yml).
# Docs-site routes (/pages/...) are checked by the VitePress build instead.
no_progress = true
max_concurrency = 8
max_retries = 3
retry_wait_time = 5
accept = ["200..=299", "429"]
include_mail = false
exclude = [
  '^https?://(localhost|127\.0\.0\.1)',
  '^https?://([a-z0-9-]+\.)?example\.(com|org|net)',
  '^file://.*/pages/',
]
exclude_path = [
  # Copied from the axios ecosystem; rewrite or delete it in #188.
  "ECOSYSTEM.md",
  # Release history inherited from axios, kept as written.
  "packages/lib/CHANGELOG.md",
  # axios's sponsor page, left out of the site (srcExclude in .vitepress/config.mts); #188.
  "packages/docs/pages/misc/sponsors.md",
  "node_modules",
]
