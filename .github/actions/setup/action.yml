name: Setup
description: Install pnpm and Node.js, then install workspace dependencies. Check out the repo first.

inputs:
  node-version:
    description: Node.js version
    default: '26.x'
  registry-url:
    description: npm registry URL for setup-node (e.g. https://registry.npmjs.org)
    default: ''
  cache:
    description: Cache the pnpm store. Turn off in jobs that publish.
    default: 'true'
  ignore-scripts:
    description: Install without running dependency lifecycle scripts
    default: 'false'

runs:
  using: composite
  steps:
    # The version comes from `packageManager` in the root package.json
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        package-manager-cache: ${{ inputs.cache == 'true' }}

    - name: Install dependencies
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [[ "$IGNORE_SCRIPTS" == "true" ]]; then
          pnpm install --frozen-lockfile --ignore-scripts
        else
          pnpm install --frozen-lockfile
        fi
