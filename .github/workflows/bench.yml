name: Benchmark

# Regenerates the Fetch, Axios and faxios comparison (`pnpm bench`): bundle sizes, the runtime
# benchmark and the docs page, uploaded as an artifact. Timing is noisy on shared runners, so this
# only runs on demand and never gates a merge.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Size and runtime comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from `packageManager` in the root package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 24 is the supported baseline the comparison reports.
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Builds and packs faxios, installs packages/bench from its frozen lockfile and runs it.
      - name: Run the comparison
        run: pnpm bench

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: |
            packages/bench/results/
            packages/docs/pages/misc/comparison.md
          if-no-files-found: error
