name: Bundle Size

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # The pnpm version comes from `packageManager` in the root package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build project
        run: pnpm --filter @gcmdev/faxios run build

      # Bundles real consumer entry points with esbuild and writes their sizes to the step summary.
      # Fails when an entry exceeds its budget.
      - name: Measure bundle size
        run: node packages/tests/scripts/bundle-size.ts
