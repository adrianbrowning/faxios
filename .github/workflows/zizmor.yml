name: GitHub Actions Security Analysis with zizmor

# Scans the GitHub Actions workflows for security problems with zizmor and
# uploads the results to code scanning. run-ci.yml does not do a security scan
# of the workflows.

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Same config and zizmor version as `pnpm run lint:actions`.
          config: .github/zizmor.yml
          version: 1.32.0

