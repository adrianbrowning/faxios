name: Knip

on:
  pull_request:
    branches:
      - main
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Run knip
        id: knip-check
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          pnpm knip 2>&1 | tee knip-output.txt
          KNIP_EXIT_CODE=$?
          echo "exit_code=$KNIP_EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $KNIP_EXIT_CODE -ne 0 ]; then
            echo "Knip checks failed. KNIP_EXIT_CODE=$KNIP_EXIT_CODE"
            exit 1
          fi

      - name: Comment knip results on PR
        if: github.event_name == 'pull_request' && steps.knip-check.outputs.exit_code != '0'
        # Fork PRs get a read-only token, so the comment can fail; the next step must still run
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('knip-output.txt', 'utf8');
            // Marks the one comment this workflow keeps up to date on the PR
            const marker = '<!-- faxios-knip -->';
            const comment = `${marker}
            ## 🔍 Knip Check Failed

            <details>
            <summary>Click to see knip errors</summary>

            \`\`\`
            ${output}
            \`\`\`

            </details>

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body: comment });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: comment });
            }

      - name: Fail if knip failed
        if: always() && steps.knip-check.outputs.exit_code != '0'
        # Repeat the findings here: this is the step `gh run view --log-failed` shows
        run: |
          cat knip-output.txt
          exit 1
