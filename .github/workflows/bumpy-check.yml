name: Bumpy Check

# Renders the release plan for each PR, and warns (never fails) when a change
# to @gcmdev/faxios has no bump file. bumpy-comment.yml posts the rendered
# comment, so this job needs no write token and works the same for forks.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          ignore-scripts: 'true'

      # bumpy skips the Version Packages PR branch by itself.
      # `--comment false`: bumpy reads the next argument as the value.
      - name: Check bump files
        run: pnpm exec bumpy ci check --comment false --no-fail --emit-comment ./bumpy-comment
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bumpy-comment
          path: ./bumpy-comment
          if-no-files-found: ignore
