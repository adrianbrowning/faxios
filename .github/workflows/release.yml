name: Release

# bumpy versioning and npm publishing for @gcmdev/faxios.
#
# - A push to main with pending bump files opens or updates the Version
#   Packages PR (bumpy/version-packages).
# - Merging that PR publishes: `npm stage publish` with provenance (approve the
#   staged version on npmjs.com with 2FA), then the git tag and GitHub release.
#   docs.yml deploys the site when that release is published.
# - The `release-rc` label on the Version Packages PR publishes a snapshot of
#   main's pending release to the `next` dist-tag. Snapshots make no tags,
#   releases or commits.
#
# Publishing runs in the `npm-publish` environment, which npm trusted
# publishing (OIDC) is bound to. BUMPY_GH_TOKEN (a PAT or app token) lets the
# version PR trigger CI and the GitHub release trigger docs.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Detects what `ci release` would do. No write token, no publish credentials.
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: 'false'
          ignore-scripts: 'true'

      - id: plan
        run: pnpm exec bumpy ci plan
        env:
          GH_TOKEN: ${{ github.token }}

  # Opens or updates the Version Packages PR. bumpy pushes with BUMPY_GH_TOKEN
  # (or GH_TOKEN), so checkout keeps no credentials.
  version:
    needs: plan
    if: needs.plan.outputs.mode == 'version-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # bumpy runs `pnpm install --lockfile-only` after it bumps the version
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
          ignore-scripts: 'true'

      - run: pnpm exec bumpy ci release --expect-mode version-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}

  publish:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
          cache: 'false'
          ignore-scripts: 'true'

      # `npm stage publish` requires npm >= 11.15.0, newer than the npm bundled with
      # this workflow's Node. Remove this step once Node bundles npm >= 11.15.0 by default.
      - name: Pin npm with staged-publishing support
        run: npm install -g npm@11.15.0

      - name: Build project
        run: pnpm run build

      # npm adds LICENSE only from packages/lib, so 0.2.0 shipped without it (#160).
      - name: Check the package includes LICENSE
        run: node packages/tests/scripts/check-license.ts

      - run: pnpm exec bumpy ci release --expect-mode publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}

  # The version PR has already consumed the bump files, so the snapshot is
  # built from main (the PR's base), where they are still pending.
  rc:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.label.name == 'release-rc' &&
      github.event.pull_request.head.ref == 'bumpy/version-packages' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
          cache: 'false'
          ignore-scripts: 'true'

      - name: Pin npm with staged-publishing support
        run: npm install -g npm@11.15.0

      - name: Build project
        run: pnpm run build

      - name: Check the package includes LICENSE
        run: node packages/tests/scripts/check-license.ts

      - run: pnpm exec bumpy ci release --snapshot rc --tag next
        env:
          GH_TOKEN: ${{ github.token }}
