name: Release

# bumpy versioning and npm publishing for @gcmdev/faxios.
#
# - A push to main with pending bump files opens or updates the Version
#   Packages PR (bumpy/version-packages).
# - Merging that PR publishes. run-ci.yml builds, packs and tests the tarball
#   on the merged commit; `publish` checks that tarball against run-ci's
#   SHA-256 and runs `npm publish <tarball> --provenance`; `release` has bumpy
#   tag the commit and publish the GitHub release. Then docs.yml deploys the
#   site and check-skills.yml reviews the skill.
# - Running this workflow by hand on main with `rc` checked publishes a
#   snapshot of main's pending release to the `next` dist-tag, built and
#   tested the same way. Snapshots make no tags, releases or commits.
#
# Trust (#270): only `publish` and `rc` get `id-token: write`. They run only
# on main, in the `npm-publish` environment (npm trusted publishing (OIDC) is
# bound to it once that npm setting is applied by hand), and they check out
# and build nothing and install only the pinned npm (`npm install -g
# npm@11.15.0 --ignore-scripts`): they run setup-node, that npm, the artifact
# download and the shell in this file. The build and its dependencies run in
# run-ci.yml with a read-only token and no OIDC.
#
# BUMPY_GH_TOKEN (a PAT or app token) lets bumpy open the Version Packages PR
# with CI running on it; without it, bumpy needs "Allow GitHub Actions to
# create and approve pull requests".

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rc:
        description: Publish a snapshot of main's pending release to the `next` dist-tag
        type: boolean
        default: false

# One release run at a time. GitHub keeps only one pending run per group: a
# newer push to main replaces a run still waiting here, so a publish queued
# behind a running release can be dropped. Don't merge to main while a
# release run is in progress; if a publish run was dropped, re-run it (it
# skips a version npm already has with the same bytes).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Detects what `ci release` would do. No write token, no publish credentials.
  plan:
    if: github.ref == 'refs/heads/main' && !inputs.rc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          cache: 'false'
          ignore-scripts: 'true'

      - id: plan
        run: pnpm exec bumpy ci plan
        env:
          GH_TOKEN: ${{ github.token }}

  # Opens or updates the Version Packages PR. bumpy pushes with BUMPY_GH_TOKEN
  # (or GH_TOKEN), so checkout keeps no credentials. Then it syncs VERSION and
  # records the skill review on that branch and hands the three changed files
  # to `push-version` as an artifact. Nothing in this job commits or pushes
  # after `intent` (dependency code) runs.
  version:
    needs: plan
    if: needs.plan.outputs.mode == 'version-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write because bumpy pushes the branch with GH_TOKEN when
    # BUMPY_GH_TOKEN is not set.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.branch.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # bumpy runs `pnpm install --lockfile-only` after it bumps the version
      - uses: $/.github/actions/setup
        with:
          cache: 'false'
          ignore-scripts: 'true'

      - run: pnpm exec bumpy ci release --expect-mode version-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}

      # `bumpy version` only bumps package.json. Put the same version into the
      # hard-coded VERSION (User-Agent, error messages) and the packaged skill's
      # library_version on the PR branch, and record the Intent review of
      # bumpy's changes, which check-skills.yml requires on every PR.
      # This step sets the job output to the commit bumpy pushed before
      # `intent` runs, and a later step can't change a step output, so
      # `push-version` commits on top of that commit whatever runs here.
      - name: Check out the Version Packages PR branch
        id: branch
        env:
          FETCH_TOKEN: ${{ github.token }}
          BRANCH: bumpy/version-packages
        run: |
          set -euo pipefail
          # Credentials only in this step's environment: not in argv, not in .git/config
          auth=$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # No token in this step's environment.
      - name: Sync VERSION and record the skill review
        run: |
          set -euo pipefail
          node packages/tests/scripts/sync-version.ts
          pnpm exec intent maintainer review --base origin/main --unchanged \
            "Version Packages PR made by bumpy: version bump, changelog entries, consumed bump files, the synced VERSION and the skill's synced library_version. No API or behaviour the skill teaches changes in this PR."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: version-pr-files
          path: |
            packages/lib/src/lib/env/data.ts
            packages/lib/skills/configure-requests/SKILL.md
            .intent/review-state.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Commits the three files from `version` on top of the commit bumpy pushed
  # and pushes them to the Version Packages PR. The push token is used only
  # here, in a fresh job where no repository or dependency code has run: no
  # setup action and no install, and git config, PATH, the environment, HEAD
  # and the index all come from a clean checkout of that commit, not from
  # `version`. Only the contents of those three files come from `version`;
  # they land in a PR that is reviewed before it merges.
  push-version:
    needs: [plan, version]
    if: needs.plan.outputs.mode == 'version-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # contents: write because the push falls back to github.token when
    # BUMPY_GH_TOKEN is not set.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: version-pr-files
          path: ${{ runner.temp }}/version-pr-files

      - name: Copy the synced files into the checkout
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/version-pr-files
        run: |
          set -euo pipefail
          files=(
            .intent/review-state.json
            packages/lib/skills/configure-requests/SKILL.md
            packages/lib/src/lib/env/data.ts
          )
          expected=$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)
          found=$(cd "$ARTIFACT_DIR" && find . -mindepth 1 ! -type d -printf '%P\n' | LC_ALL=C sort)
          if [[ "$found" != "$expected" ]]; then
            echo "::error::expected only ${files[*]} in the artifact, found: ${found//$'\n'/, }"
            exit 1
          fi
          for f in "${files[@]}"; do
            if [[ ! -f "$ARTIFACT_DIR/$f" || -L "$ARTIFACT_DIR/$f" ]]; then
              echo "::error::$f in the artifact is not a regular file"
              exit 1
            fi
            cp -- "$ARTIFACT_DIR/$f" "$f"
          done
          git add -- "${files[@]}"

      # A plain push, not a force push: it fails if the branch moved after
      # bumpy pushed it.
      - name: Push to the Version Packages PR
        env:
          PUSH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN || github.token }}
          BRANCH: bumpy/version-packages
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "VERSION, the skill and the Intent record are already in sync"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(release): sync VERSION and record the skill review"
          # Credentials only in this step's environment: not in argv, not in .git/config
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git push "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

  # The publish gate (#162): the full PR suite on the commit that publishes.
  # It builds and packs the tarball that `publish` publishes.
  ci:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    permissions:
      contents: read
    uses: $/.github/workflows/run-ci.yml

  # Publishes the tarball run-ci.yml tested. No checkout or build, and the only
  # install is the pinned npm (--ignore-scripts): nothing from the repository
  # or its dependencies runs next to the OIDC token.
  publish:
    needs: [plan, ci]
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # setup-node's npm follows the Node release; pin the npm that publishes
      # (trusted publishing needs npm >= 11.5.1).
      - name: Pin npm
        run: npm install -g npm@11.15.0 --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faxios-tarball
          path: tarball

      # The checksum comes from run-ci's job output, not from the artifact, so
      # a replaced artifact fails here.
      - name: Check the tarball is the one CI tested
        working-directory: tarball
        env:
          TARBALL_NAME: ${{ needs.ci.outputs.tarball-name }}
          TARBALL_SHA256: ${{ needs.ci.outputs.tarball-sha256 }}
          VERSION: ${{ needs.ci.outputs.version }}
        run: &check-tarball |
          set -euo pipefail
          files=(*)
          if [[ ! "$TARBALL_SHA256" =~ ^[0-9a-f]{64}$ || "${files[*]}" != "$TARBALL_NAME" ]]; then
            echo "::error::expected only $TARBALL_NAME (sha256 '$TARBALL_SHA256') in the artifact, found: ${files[*]}"
            exit 1
          fi
          echo "$TARBALL_SHA256  $TARBALL_NAME" | sha256sum --check --strict
          manifest=$(tar -xOzf "$TARBALL_NAME" package/package.json)
          id=$(node -p 'const m = JSON.parse(process.argv[1]); m.name + "@" + m.version' "$manifest")
          if [[ "$id" != "@gcmdev/faxios@$VERSION" ]]; then
            echo "::error::the tarball holds $id, expected @gcmdev/faxios@$VERSION"
            exit 1
          fi
          # npm adds LICENSE only from packages/lib, so 0.2.0 shipped without it (#160).
          if ! tar -tzf "$TARBALL_NAME" | grep -qx 'package/LICENSE'; then
            echo "::error::the tarball has no LICENSE"
            exit 1
          fi

      # A run whose `release` job failed leaves the version on npm without a
      # tag, so the next run plans the publish again. Skip it when npm already
      # has these exact bytes; fail when it has a different tarball.
      - name: Publish to npm
        env:
          TARBALL_NAME: ${{ needs.ci.outputs.tarball-name }}
          VERSION: ${{ needs.ci.outputs.version }}
        run: |
          set -euo pipefail
          tarball="tarball/$TARBALL_NAME"
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          published=$(npm view "@gcmdev/faxios@$VERSION" dist.integrity 2>/dev/null || true)
          if [[ -z "$published" ]]; then
            npm publish "$tarball" --access public --provenance --ignore-scripts
          elif [[ "$published" == "$integrity" ]]; then
            echo "@gcmdev/faxios@$VERSION is already on npm with this tarball; skipping the publish"
          else
            echo "::error::@gcmdev/faxios@$VERSION is already on npm with a different tarball ($published, this one is $integrity)"
            exit 1
          fi

  # Tags the release commit and publishes the GitHub release. The package's
  # `publishCommand` in .bumpy/_config.json only confirms the version is on
  # npm, so bumpy publishes nothing; this job has no OIDC token.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          cache: 'false'
          ignore-scripts: 'true'

      # bumpy creates the tag and the GitHub release here; `publish` published to npm.
      - run: pnpm exec bumpy ci release --expect-mode publish # zizmor: ignore[use-trusted-publishing]
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}

  # On the push to main, which the github-pages environment admits (#167).
  docs:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/docs.yml

  # A release created with the default token doesn't fire `release: published`,
  # so start check-skills' post-release review directly.
  skills-review:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch check-skills
        run: gh workflow run check-skills.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  # The snapshot build: main's pending release, versioned
  # `<next version>-rc-<short sha>` and tested by the full suite.
  rc-ci:
    if: github.ref == 'refs/heads/main' && inputs.rc
    permissions:
      contents: read
    uses: $/.github/workflows/run-ci.yml
    with:
      snapshot: rc

  # Publishes the snapshot tarball rc-ci tested, like `publish`, to `next`.
  rc:
    needs: rc-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # setup-node's npm follows the Node release; pin the npm that publishes
      # (trusted publishing needs npm >= 11.5.1).
      - name: Pin npm
        run: npm install -g npm@11.15.0 --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faxios-tarball
          path: tarball

      - name: Check the tarball is the one CI tested
        working-directory: tarball
        env:
          TARBALL_NAME: ${{ needs.rc-ci.outputs.tarball-name }}
          TARBALL_SHA256: ${{ needs.rc-ci.outputs.tarball-sha256 }}
          VERSION: ${{ needs.rc-ci.outputs.version }}
        run: *check-tarball

      # A snapshot version must be a prerelease, so it can never become `latest`.
      - name: Publish to npm
        env:
          TARBALL_NAME: ${{ needs.rc-ci.outputs.tarball-name }}
          VERSION: ${{ needs.rc-ci.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" != *-rc-* ]]; then
            echo "::error::$VERSION is not an rc snapshot version"
            exit 1
          fi
          npm publish "tarball/$TARBALL_NAME" --access public --provenance --ignore-scripts --tag next
          echo "Published \`@gcmdev/faxios@$VERSION\` to \`next\`: \`npm install @gcmdev/faxios@next\`" >> "$GITHUB_STEP_SUMMARY"
