name: Continuous integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  FAXIOS_TARBALL: /tmp/faxios-0.0.1.tgz

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-run-vitest:
    name: Build and run vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Build project
        run: pnpm run build

      - name: Install Playwright with deps
        working-directory: packages/tests
        run: pnpm exec playwright install --with-deps

      - name: Run unit tests
        run: pnpm run test:vitest:unit

      - name: Run browser tests
        run: pnpm run test:vitest:browser:headless

      - name: Pack tarball
        working-directory: packages/lib
        run: pnpm pack

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          # dev server CVEs in private docs package (vite@5.x no patch; esbuild dev server)
          allow-ghsas: GHSA-fx2h-pf6j-xcff,GHSA-4w7w-66w2-5vf9,GHSA-v6wh-96g9-6wx3,GHSA-67mh-4wv8-2f99

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faxios-tarball
          path: packages/lib/faxios-*.tgz
          if-no-files-found: error
          retention-days: 1


  esm-smoke-tests:
    name: ESM smoke tests (Node ${{ matrix.node-version }})
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faxios-tarball
          path: artifacts

      - name: Install ESM smoke test dependencies
        run: |
          cp artifacts/faxios-*.tgz "$FAXIOS_TARBALL"
          cd packages/tests/smoke/esm
          pnpm install --no-frozen-lockfile --ignore-workspace --ignore-scripts

      - name: Run ESM smoke tests
        working-directory: packages/tests/smoke/esm
        run: pnpm run test:smoke:esm:vitest

  esm-module-tests:
    name: ESM module tests (Node ${{ matrix.node-version }})
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faxios-tarball
          path: artifacts

      - name: Install ESM module test dependencies
        run: |
          cp artifacts/faxios-*.tgz "$FAXIOS_TARBALL"
          cd packages/tests/module/esm
          pnpm install --no-frozen-lockfile --ignore-workspace --ignore-scripts

      - name: Run ESM module tests
        working-directory: packages/tests/module/esm
        run: pnpm run test:module:esm

  bun-smoke-tests:
    name: Bun smoke tests
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faxios-tarball
          path: artifacts

      - name: Install packed faxios
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        run: |
          mkdir -p "$BUN_INSTALL_CACHE_DIR"
          cp artifacts/faxios-*.tgz "$FAXIOS_TARBALL"
          cd packages/tests/smoke/bun
          rm -f bun.lock
          bun install

      - name: Run Bun smoke tests
        working-directory: packages/tests/smoke/bun
        run: bun test

  deno-smoke-tests:
    name: Deno smoke tests
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          cache: false

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faxios-tarball
          path: artifacts

      - name: Prepare packed faxios dist
        run: mkdir -p packages/lib/dist && tar -xzf artifacts/faxios-*.tgz -C artifacts && cp -R artifacts/package/dist/. ./packages/lib/dist

      - name: Install Deno smoke test dependencies
        working-directory: packages/tests/smoke/deno
        run: deno install

      - name: Run Deno smoke tests
        working-directory: packages/tests/smoke/deno
        run: deno task test
