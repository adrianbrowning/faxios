name: Continuous integration

# The one CI suite: pull requests, pushes to main, and release.yml, which runs
# it on the commit it publishes (#162). The build job packs the package
# tarball once; every later job tests that file, and release.yml publishes it
# after checking it against the `tarball-sha256` output (#270).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_call:
    inputs:
      snapshot:
        description: Snapshot name (e.g. `rc`). Packs main's pending release as `<next version>-<name>-<short sha>`.
        type: string
        default: ''
    outputs:
      tarball-name:
        description: File name of the packed tarball in the `faxios-tarball` artifact
        value: ${{ jobs.build-and-run-vitest.outputs.tarball-name }}
      tarball-sha256:
        description: SHA-256 of the packed tarball
        value: ${{ jobs.build-and-run-vitest.outputs.tarball-sha256 }}
      version:
        description: Package version inside the tarball
        value: ${{ jobs.build-and-run-vitest.outputs.version }}

permissions:
  contents: read

env:
  FAXIOS_TARBALL: packages/tests/faxios.tgz

concurrency:
  # The `ci-` prefix keeps a run called from release.yml out of release.yml's own group.
  # A newer push to a PR cancels the run it supersedes. Every other run has a group of its
  # own commit: GitHub keeps one pending run per group and cancels it when a newer one
  # queues, even without cancel-in-progress, so a group per ref would drop queued main commits.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-run-vitest:
    name: Build and run vitest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tarball-name: ${{ steps.pack.outputs.name }}
      tarball-sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from `packageManager` in the root package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Only pull requests use the pnpm store cache: runs on main build the
      # tarball that release.yml publishes.
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: ${{ github.event_name == 'pull_request' && 'pnpm' || '' }}
          package-manager-cache: ${{ github.event_name == 'pull_request' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # bumpy's snapshot version: the next version from the pending bump files,
      # then the name and the short sha. VERSION in data.ts must match it.
      - name: Set the snapshot version
        if: inputs.snapshot
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          set -euo pipefail
          if [[ ! "$SNAPSHOT" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::snapshot name must be lower-case letters, digits and dashes"
            exit 1
          fi
          next=$(pnpm exec bumpy status --json --filter @gcmdev/faxios \
            | node -e 'let s = ""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).releases[0]?.newVersion ?? ""))')
          if [[ -z "$next" ]]; then
            echo "::error::no pending release on this commit; a snapshot needs pending bump files"
            exit 1
          fi
          version="$next-$SNAPSHOT-$(git rev-parse --short=7 HEAD)"
          npm --prefix packages/lib pkg set "version=$version"
          node packages/tests/scripts/sync-version.ts

      - name: Lint
        run: pnpm run lint

      # Writes nothing; fails when a Markdown copy differs from its file= source (mdcode.config.json).
      # `pnpm check` runs it too.
      - name: Check Markdown examples are in sync
        run: pnpm run docs:sync:check

      - name: Build project
        run: pnpm run build

      # Packed and hashed straight after the build, before any test or docs tooling runs in this
      # workspace, so nothing later can change what release.yml publishes: a changed .tgz fails
      # its sha256 check. npm, not pnpm: npm is the publisher, and check-license.ts checks npm's
      # file list.
      - name: Pack tarball
        id: pack
        working-directory: packages/lib
        run: |
          set -euo pipefail
          name=$(npm pack --ignore-scripts --json | node -e 'let s = ""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s)[0].filename))')
          sha256=$(sha256sum "$name" | cut -d ' ' -f 1)
          version=$(node -p 'require("./package.json").version')
          {
            echo "name=$name"
            echo "sha256=$sha256"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Packed \`$name\` (version $version), sha256 \`$sha256\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright with deps
        working-directory: packages/tests
        run: pnpm exec playwright install --with-deps

      - name: Run unit tests
        run: pnpm run test:vitest:unit

      - name: Check docs examples
        run: pnpm run test:docs-examples

      # The production VitePress build, so a broken page or config fails the PR instead of the
      # post-release deploy (docs.yml). `pnpm check` runs it too.
      - name: Build docs
        run: pnpm run docs:build

      - name: Run browser tests
        run: pnpm run test:vitest:browser:headless

      # Compares against a PR's base, so it only runs on pull requests.
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faxios-tarball
          path: packages/lib/${{ steps.pack.outputs.name }}
          if-no-files-found: error
          retention-days: 1


  esm-smoke-tests:
    name: ESM smoke tests (Node ${{ matrix.node-version }})
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faxios-tarball
          path: artifacts

      - name: Install ESM smoke test dependencies
        run: |
          cp artifacts/*faxios-*.tgz "$FAXIOS_TARBALL"
          node packages/tests/pin-tarball-integrity.ts smoke/esm/pnpm-lock.yaml
          cd packages/tests/smoke/esm
          pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts

      # Against the installed tarball's declarations, with the TypeScript and @types/node from
      # packages/tests (smoke/esm/tsconfig.json reads its @types from there).
      - name: Install TypeScript for the ESM smoke type-check
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @faxios/tests

      - name: Type-check ESM smoke tests
        working-directory: packages/tests
        run: pnpm exec tsc --noEmit -p smoke/esm/tsconfig.json

      - name: Run ESM smoke tests
        working-directory: packages/tests/smoke/esm
        run: pnpm run test:smoke:esm:vitest

  esm-module-tests:
    name: ESM module tests (Node ${{ matrix.node-version }})
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faxios-tarball
          path: artifacts

      - name: Install ESM module test dependencies
        run: |
          cp artifacts/*faxios-*.tgz "$FAXIOS_TARBALL"
          node packages/tests/pin-tarball-integrity.ts module/esm/pnpm-lock.yaml
          cd packages/tests/module/esm
          pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts

      - name: Run ESM module tests
        working-directory: packages/tests/module/esm
        run: pnpm run test:module:esm

  bun-smoke-tests:
    name: Bun smoke tests
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faxios-tarball
          path: artifacts

      - name: Install packed faxios
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        run: |
          mkdir -p "$BUN_INSTALL_CACHE_DIR"
          cp artifacts/*faxios-*.tgz "$FAXIOS_TARBALL"
          bun packages/tests/pin-tarball-integrity.ts smoke/bun/bun.lock
          cd packages/tests/smoke/bun
          bun install --frozen-lockfile

      # Against the installed tarball's declarations, with the TypeScript and @types/bun in bun.lock.
      - name: Type-check Bun smoke tests
        working-directory: packages/tests/smoke/bun
        run: bun node_modules/typescript/bin/tsc --noEmit -p tsconfig.json

      - name: Run Bun smoke tests
        working-directory: packages/tests/smoke/bun
        run: bun test

  deno-smoke-tests:
    name: Deno smoke tests
    needs: build-and-run-vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          cache: false

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faxios-tarball
          path: artifacts

      # Deno can't install a tarball dependency, so the `install` task extracts $FAXIOS_TARBALL
      # into smoke/deno/.faxios (package.json's `file:` dependency) and runs `deno install --frozen`.
      # deno.json sets `lock.frozen`, so the install and the test task fail when deno.lock must change.
      - name: Install Deno smoke test dependencies
        run: |
          cp artifacts/*faxios-*.tgz "$FAXIOS_TARBALL"
          deno task --cwd packages/tests/smoke/deno install

      - name: Run Deno smoke tests
        working-directory: packages/tests/smoke/deno
        run: deno task test
