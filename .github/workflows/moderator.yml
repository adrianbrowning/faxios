name: AI Moderator
# On issue_comment, GitHub runs this file from the default branch, and checkout
# gets the default branch (persist-credentials: false). The job runs only the
# pinned github/ai-moderator action, so no PR code runs with that event's token.
on:
  issues:
    types: [opened]
  issue_comment: # zizmor: ignore[dangerous-triggers] -- no PR code runs; see above
    types: [created]
  pull_request_review_comment:
    types: [created]

# One run at a time per issue or pull request, so a burst of comments does
# not start parallel AI runs. GitHub keeps one pending run per group, so in a
# burst the comments between the running and the newest one are not checked.
concurrency:
  group: moderator-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  spam-detection:
    name: AI Moderator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
      models: read
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run AI Moderator
        uses: github/ai-moderator@81159c370785e295c97461ade67d7c33576e9319 # v1.1.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          spam-label: 'spam'
          ai-label: 'ai-generated'
          minimize-detected-comments: true
          enable-spam-detection: true
          enable-link-spam-detection: true
          enable-ai-detection: true
