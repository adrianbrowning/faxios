name: Lockfile lint

on:
  pull_request:
    paths:
      - 'packages/lib/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/lockfile-lint.yml'
  push:
    branches: [main]
    paths:
      - 'packages/lib/package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  lockfile-lint:
    name: Validate package-lock.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # The pnpm version comes from `packageManager` in the root package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        # --frozen-lockfile on install already enforces lockfile integrity.
        # pnpm audit catches known CVEs and non-HTTPS registry entries.
        run: pnpm audit --audit-level=high
