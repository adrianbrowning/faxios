name: Lockfile lint

# Every tracked lockfile is audited here and kept current by Dependabot; the
# `lockfile-coverage` job fails when a lockfile is missing from either.
on:
  pull_request:
    paths:
      - 'packages/lib/package.json'
      - 'packages/tests/smoke/**/package.json'
      - 'packages/tests/module/**/package.json'
      - 'packages/tests/smoke/deno/deno.json'
      - '**/pnpm-lock.yaml'
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/bun.lock'
      - '**/bun.lockb'
      - '**/deno.lock'
      - '.github/dependabot.yml'
      - '.github/scripts/check-lockfile-coverage.mjs'
      - '.github/workflows/lockfile-lint.yml'
  push:
    branches: [main]
    paths:
      - 'packages/lib/package.json'
      - 'packages/tests/smoke/**/package.json'
      - 'packages/tests/module/**/package.json'
      - 'packages/tests/smoke/deno/deno.json'
      - '**/pnpm-lock.yaml'
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/bun.lock'
      - '**/bun.lockb'
      - '**/deno.lock'
      - '.github/dependabot.yml'
      - '.github/scripts/check-lockfile-coverage.mjs'

permissions:
  contents: read

jobs:
  lockfile-lint:
    name: Validate package-lock.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # The pnpm version comes from `packageManager` in the root package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        # --frozen-lockfile on install already enforces lockfile integrity.
        # pnpm audit catches known CVEs and non-HTTPS registry entries.
        run: pnpm audit --audit-level=high

  harness-audit:
    name: Audit test harness lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # The pnpm version comes from `packageManager` in the root package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      # The harnesses install with --ignore-workspace, so the workspace `overrides`
      # don't reach them; audit their own lockfiles. pnpm audit reads only the lockfile.
      - name: Audit smoke/esm
        run: pnpm --dir packages/tests/smoke/esm audit --audit-level=high --ignore-workspace

      - name: Audit module/esm
        run: pnpm --dir packages/tests/module/esm audit --audit-level=high --ignore-workspace

      - name: Audit smoke/bun
        working-directory: packages/tests/smoke/bun
        run: bun audit --audit-level=high

  lockfile-coverage:
    name: Check every lockfile is updated and audited
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Check lockfile coverage
        run: node .github/scripts/check-lockfile-coverage.mjs
