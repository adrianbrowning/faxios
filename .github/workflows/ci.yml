name: Workspace CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# A newer push to a PR cancels the run it supersedes; runs on main all finish, so each merge gets a result
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: pull_request runs from forks get no secrets and no write token either way
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs once at the workspace root: frozen lockfile, pnpm store cached by the lockfile hash
      - uses: $/.github/actions/setup

      # The root scripts run each package's script (`pnpm -r --if-present …`); a failure in any package fails the step
      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm lint:ts

      # The browser project runs headless Chromium, Firefox and WebKit
      - name: Install Playwright with deps
        working-directory: packages/tests
        run: pnpm exec playwright install --with-deps

      # unit/scripts/bundleSize.test.ts bundles the built package, so build before testing
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Build docs
        run: pnpm docs:build

