name: Bumpy PR Comment

# Posts the comment that bumpy-check.yml rendered, for fork PRs whose own token
# is read-only. Runs default-branch code only: it never checks out the PR, never
# installs dependencies, and uses the artifact only as comment text. bumpy takes
# the PR number from the trusted workflow_run event, not from the artifact.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- no PR code runs; see above
    workflows: ['Bumpy Check']
    types: [completed]

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      # Default branch: read the pinned bumpy version from package.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false

      # Outside the checkout, so the untrusted artifact can't overwrite trusted files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: bumpy-comment
          path: ${{ runner.temp }}/bumpy-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post comment
        run: |
          BUMPY_VERSION=$(jq -r '.devDependencies["@varlock/bumpy"]' package.json)
          npx --yes "@varlock/bumpy@${BUMPY_VERSION}" ci comment --body-file "$RUNNER_TEMP/bumpy-comment/comment.md"
        env:
          GH_TOKEN: ${{ github.token }}
